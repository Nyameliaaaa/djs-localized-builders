name: Tests
on:
    push:
        branches: [main]
    pull_request: 
      branches: [main]

jobs:
    lint:
        name: ESLint
        runs-on: docker

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Install Node v24
              uses: actions/setup-node@v3
              with:
                  node-version: 24

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run ESLint
              run: pnpm run lint

    typescript:
        name: Typescript
        runs-on: docker
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Install Node v24
              uses: actions/setup-node@v3
              with:
                  node-version: 24

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run TypeScript compiler
              run: pnpm run test:typescript