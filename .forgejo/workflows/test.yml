name: Tests
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: ESLint
        runs-on: docker

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Install Node v24
              uses: actions/setup-node@v3
              with:
                  node-version: 24

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run ESLint
              run: pnpm run lint

    typescript:
        name: TypeScript
        runs-on: docker
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Install Node v24
              uses: actions/setup-node@v3
              with:
                  node-version: 24

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run TypeScript compiler
              run: pnpm run test:typescript

    commitlint:
        name: CommitLint
        runs-on: docker

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
              with:
                fetch-depth: 0

            - name: Install Node v24
              uses: actions/setup-node@v2
              with:
                  node-version: 24

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run commitlint
              run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
